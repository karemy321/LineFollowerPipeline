plugins {
    id 'java-library'
}

group   = 'com.example.linefollower'
version = '1.0.0'

// Build outside OneDrive: OneDrive's sync locks build intermediates, which makes
// Gradle fail with "Unable to delete directory". Same approach as RoboPhoneApp.
layout.buildDirectory.set(file("C:/RoboPhoneBuild/library"))

repositories {
    mavenCentral()
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}

java {
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

jar {
    archiveBaseName = 'LineFollowerPipeline'
    archiveVersion  = '1.0.0'
}

// v3 scenario tests (V3ScenarioTest): -Dv3.runAll=true also runs scenarios for phases not yet
// implemented; per-frame traces are written to <build>/v3-scenarios/.
test {
    systemProperty 'v3.runAll', System.getProperty('v3.runAll', 'false')
    systemProperty 'v3.reportDir', layout.buildDirectory.dir('v3-scenarios').get().asFile.absolutePath
    // CapturedScenesTest: captures saved on the phone (default src/test/captures)
    systemProperty 'captures.dir', System.getProperty('captures.dir', file('src/test/captures').absolutePath)
    maxHeapSize = '2g'
}

// gradlew perf — ms per frame at 960 × 1280 YUV (PerfBench).
tasks.register('perf', JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.example.linefollower.PerfBench'
    maxHeapSize = '2g'
}

// gradlew checkJava8 — the library itself must stay Java 8 (plan §1); the tests use Java 11.
tasks.register('checkJava8', JavaCompile) {
    source = sourceSets.main.java
    classpath = files()
    destinationDirectory = layout.buildDirectory.dir('java8-check')
    options.release = 8
    options.compilerArgs += ['-Xlint:-options']
}

// gradlew replay -Pcapture=<lfcap_*.bin> [-Pset=name=value,...] — replay a capture saved on the phone
// by LineFollowerPipeline.Recorder (CaptureReplay).
tasks.register('replay', JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.example.linefollower.CaptureReplay'
    maxHeapSize = '2g'
    args = [project.findProperty('capture') ?: '', project.findProperty('set') ?: '']
}
